# Beast Arena Server — Fly.io deployment config
# Deploy: flyctl launch / flyctl deploy

app = "beast-arena-server"
primary_region = "sin" # Singapore — closest to SEA users

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ENV = "production"
  CHAR_DIR = "/app/characters"
  GIN_MODE = "release"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # Keep alive for WebSocket connections
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 2500
    soft_limit = 2000

[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"

  [[services.http_checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    protocol = "http"
    restart_limit = 0
    timeout = "2s"
    tls_skip_verify = false

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 512

# Secrets (set via flyctl secrets set):
#   DB_URL          — PostgreSQL connection string
#   REDIS_URL       — Redis connection string
#   JWT_SECRET      — JWT signing secret (min 32 chars)
